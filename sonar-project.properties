# SMS-39: SonarCloud analysis, run by the "sonarcloud" job in .github/workflows/ci.yml.
#
# One-time setup by a repository admin:
#   1. Sign in at https://sonarcloud.io with GitHub and import this repository.
#   2. Check that the organization and project key below match what SonarCloud shows.
#   3. In SonarCloud, turn off "Automatic Analysis" (CI analysis is used instead).
#   4. Create a token (My Account > Security) and add it to GitHub as the repository
#      secret SONAR_TOKEN (Settings > Secrets and variables > Actions).
# Until SONAR_TOKEN exists the job is skipped with a warning, so CI still passes.

sonar.organization=harshitvaish94
sonar.projectKey=harshitvaish94_Survey-Software-Creating-Conducting-Online-Surveys-and-Publishing-Results
sonar.projectName=Survey Management System

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,frontend/src/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/src/database/migrations/**
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,backend/src/main.ts,backend/src/**/*.module.ts,backend/src/testing/**,backend/src/database/**,frontend/src/main.tsx,frontend/src/test/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
