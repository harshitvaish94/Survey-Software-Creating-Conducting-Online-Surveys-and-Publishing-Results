# Production web server for the frontend (frontend/Dockerfile).
# The official nginx image fills in ${API_ORIGIN} from the environment when the
# container starts (it reads /etc/nginx/templates/*.template).

server {
  listen 80;
  root /usr/share/nginx/html;
  # Don't announce the nginx version (ZAP 10036)
  server_tokens off;

  # SMS-39 (ZAP findings): security headers on every response.
  # Allows only what the app uses: its own files, Google Fonts, hCaptcha (SMS-34),
  # the API (API_ORIGIN) and data: images for QR codes (SMS-24).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' https://fonts.googleapis.com https://hcaptcha.com https://*.hcaptcha.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${API_ORIGIN} https://hcaptcha.com https://*.hcaptcha.com; frame-src https://hcaptcha.com https://*.hcaptcha.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri /index.html;
  }
}
