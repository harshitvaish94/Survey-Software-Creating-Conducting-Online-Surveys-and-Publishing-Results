name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sms-backend:${{ env.SHA }}
            ghcr.io/${{ github.repository_owner }}/sms-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sms-frontend:${{ env.SHA }}
            ghcr.io/${{ github.repository_owner }}/sms-frontend:latest

  deploy-staging:
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Trigger staging deploy
        run: |
          curl -fsS -X POST "${{ secrets.BACKEND_DEPLOY_HOOK }}"
          curl -fsS -X POST "${{ secrets.FRONTEND_DEPLOY_HOOK }}"
      - name: Smoke test staging
        run: bash scripts/smoke-test.sh "${{ vars.API_URL }}" "${{ vars.WEB_URL }}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Trigger production deploy
        run: |
          curl -fsS -X POST "${{ secrets.BACKEND_DEPLOY_HOOK }}"
          curl -fsS -X POST "${{ secrets.FRONTEND_DEPLOY_HOOK }}"
      - name: Smoke test production
        run: bash scripts/smoke-test.sh "${{ vars.API_URL }}" "${{ vars.WEB_URL }}"