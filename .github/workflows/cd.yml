name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sms-backend:${{ env.SHA }}
            ghcr.io/${{ github.repository_owner }}/sms-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sms-frontend:${{ env.SHA }}
            ghcr.io/${{ github.repository_owner }}/sms-frontend:latest

  deploy-staging:
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Check the staging settings
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          missing=0
          for name in BACKEND_DEPLOY_HOOK FRONTEND_DEPLOY_HOOK; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set for the staging environment (Settings > Environments > staging > Environment secrets). See docs/DEPLOYMENT.md."
              missing=1
            fi
          done
          for name in API_URL WEB_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set for the staging environment (Settings > Environments > staging > Environment variables). See docs/DEPLOYMENT.md."
              missing=1
            fi
          done
          exit $missing
      - name: Trigger staging deploy
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$BACKEND_DEPLOY_HOOK"
          curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK"
      - name: Smoke test staging
        run: bash scripts/smoke-test.sh "${{ vars.API_URL }}" "${{ vars.WEB_URL }}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Check the production settings
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          missing=0
          for name in BACKEND_DEPLOY_HOOK FRONTEND_DEPLOY_HOOK; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set for the production environment (Settings > Environments > production > Environment secrets). See docs/DEPLOYMENT.md."
              missing=1
            fi
          done
          for name in API_URL WEB_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set for the production environment (Settings > Environments > production > Environment variables). See docs/DEPLOYMENT.md."
              missing=1
            fi
          done
          exit $missing
      - name: Trigger production deploy
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$BACKEND_DEPLOY_HOOK"
          curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK"
      - name: Smoke test production
        run: bash scripts/smoke-test.sh "${{ vars.API_URL }}" "${{ vars.WEB_URL }}"
