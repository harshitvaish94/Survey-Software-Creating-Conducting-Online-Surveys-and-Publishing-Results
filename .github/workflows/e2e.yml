name: E2E

# SMS-38: Playwright end-to-end tests against the staging site.
# Runs when the CD workflow finishes, or by hand from the Actions tab.
# Uses the same repository variables as cd.yml: WEB_URL (frontend) and API_URL (backend).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CD"]
    types: [completed]
    branches: [main]

jobs:
  e2e-staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      E2E_BASE_URL: ${{ vars.WEB_URL }}
      E2E_API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
